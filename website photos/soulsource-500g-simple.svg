<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" role="img" aria-label="Soulsource Ceremonial Cacao 500g">
  <title>Soulsource Ceremonial Cacao 500g</title>

  <!-- Background: light chocolate -->
  <rect width="800" height="760" rx="28" fill="#CFA97C"/>
  <rect x="22" y="22" width="756" height="716" rx="18" fill="none" stroke="#4A2F18" stroke-width="1.5"/>

  <!-- Crescent -->
  <g transform="translate(400,78)">
    <path d="M -13,-15 A 17,17 0 1 0 -13,15 A 20,20 0 1 1 -13,-15 Z" fill="#4A2F18"/>
  </g>

  <!-- Sparkle under crescent -->
  <g transform="translate(400,112)" fill="#4A2F18">
    <path d="M0,-7 L2.1,-2.1 7,0 2.1,2.1 0,7 -2.1,2.1 -7,0 -2.1,-2.1 Z"/>
  </g>

  <!-- Wordmark -->
  <text x="400" y="192" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="700" fill="#4A2F18">soulsource</text>

  <!-- Subtitle -->
  <text x="400" y="230" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" letter-spacing="7" fill="#2C1B0E">CEREMONIAL CACAO</text>

  <!-- Divider -->
  <line x1="308" y1="250" x2="382" y2="250" stroke="#4A2F18" stroke-width="1.5"/>
  <line x1="418" y1="250" x2="492" y2="250" stroke="#4A2F18" stroke-width="1.5"/>
  <path d="M400,244 L406,250 L400,256 L394,250 Z" fill="#4A2F18"/>

  <!-- Tagline -->
  <text x="400" y="282" text-anchor="middle" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#5C4530">PURE &#183; NATURAL &#183; ETHICALLY SOURCED</text>

  <!-- Origin -->
  <text x="400" y="309" text-anchor="middle" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#425A3A">100% VENEZUELAN CACAO</text>

  <!-- Nourish Connect Awaken -->
  <text x="400" y="352" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#425A3A">Nourish &#183; Connect &#183; Awaken</text>

  <!-- Cacao pod icon -->
  <g transform="translate(400,518)">
    <!-- stem -->
    <path d="M0,-132 C -3,-142 3,-142 0,-150" stroke="#425A3A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- small leaf -->
    <path d="M0,-146 C 12,-151 20,-142 15,-130 C 5,-133 -1,-139 0,-146 Z" fill="#5F7D55"/>
    <!-- pod outline -->
    <path d="M0,-132 C 40,-92 40,92 0,132 C -40,92 -40,-92 0,-132 Z" fill="#E8CBA0" stroke="#4A2F18" stroke-width="3"/>
    <!-- ridges -->
    <path d="M-22,-112 C -37,-72 -37,72 -22,112" fill="none" stroke="#4A2F18" stroke-width="2" opacity="0.5"/>
    <path d="M-7,-124 C -14,-76 -14,76 -7,124" fill="none" stroke="#4A2F18" stroke-width="2" opacity="0.5"/>
    <path d="M7,-124 C 14,-76 14,76 7,124" fill="none" stroke="#4A2F18" stroke-width="2" opacity="0.5"/>
    <path d="M22,-112 C 37,-72 37,72 22,112" fill="none" stroke="#4A2F18" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Bottom divider -->
  <line x1="70" y1="676" x2="730" y2="676" stroke="#4A2F18" stroke-width="1" opacity="0.4"/>

  <!-- Weight -->
  <text x="60" y="718" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#2C1B0E">500g <tspan font-size="18" baseline-shift="8">e</tspan></text>

  <!-- Made with love -->
  <text x="740" y="708" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1" fill="#5C4530">MADE WITH LOVE</text>
  <text x="740" y="724" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1" fill="#5C4530">MADE WITH INTENTION</text>
</svg>
