<line x1="12.8" y1="183.21" x2="147.20000000000002" y2="183.21" stroke="#4A2F18" stroke-width="0.12" opacity="0.25"/>
<line x1="12.8" y1="188.16" x2="147.20000000000002" y2="188.16" stroke="#4A2F18" stroke-width="0.2" opacity="0.4"/>
<text x="12.8" y="190.55" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.95" font-weight="700" fill="#2C1B0E">INGREDIENTS</text>
<text x="12.8" y="194.98" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.95" fill="#5C4530">100% Venezuelan cacao. No additives, just pure cacao in its most potent</text>
<text x="12.8" y="198.96" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.95" fill="#5C4530">form.</text>
<text x="12.8" y="204.42" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.95" font-weight="700" fill="#2C1B0E">STORAGE</text>
<text x="12.8" y="208.84" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.95" fill="#5C4530">Store in a cool, dark place and keep airtight after opening. Suggested</text>
<text x="12.8" y="212.83" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.95" fill="#5C4530">serving 10–30g.</text>
<line x1="12.8" y1="217.99" x2="147.20000000000002" y2="217.99" stroke="#4A2F18" stroke-width="0.2" opacity="0.4"/>
<text x="12.8" y="220.64" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="3.98" font-weight="700" fill="#2C1B0E">500g <tspan font-size="2.51" baseline-shift="1.18">e</tspan></text>
<text x="147.20000000000002" y="220.64" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.95" fill="#5C4530">@thehilltopsauna</text>
