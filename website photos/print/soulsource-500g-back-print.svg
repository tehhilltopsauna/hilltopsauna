<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="230mm" viewBox="0 0 160 230" role="img" aria-label="Soulsource Ceremonial Cacao 500g — Back Label">
  <title>Soulsource Ceremonial Cacao 500g — Back Label</title>
  <rect width="160" height="230" fill="#D8CFBE"/>
  <rect x="6.90" y="6.90" width="146.20" height="216.20" fill="none" stroke="#4A2F18" stroke-width="0.35" opacity="0.6"/>
<g transform="translate(80.0,10.35)"><path d="M -1.3,-1.5 A 1.7,1.7 0 1 0 -1.3,1.5 A 2.0,2.0 0 1 1 -1.3,-1.5 Z" fill="#4A2F18"/></g>
<text x="80.0" y="20" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="9" font-weight="700" fill="#8A6A2F">soulsource</text>
<text x="80.0" y="26" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="3.0" font-weight="600" letter-spacing="0.90" fill="#2C1B0E">CEREMONIAL CACAO</text>
<line x1="12.8" y1="28.70" x2="147.20000000000002" y2="28.70" stroke="#4A2F18" stroke-width="0.2" opacity="0.4"/>
<text x="12.8" y="44.00" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="3.65" font-weight="700" letter-spacing="1.09" fill="#425A3A">YOUR CACAO RITUAL</text>
<circle cx="14.40" cy="49.06" r="1.9" fill="#425A3A"/>
<text x="14.40" y="49.62" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="2.85" font-weight="700" fill="#fff">1</text>
<text x="17.00" y="50.16" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="3.35" font-weight="700" fill="#2C1B0E">MEASURE</text>
<text x="17.00" y="54.34" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.78" fill="#5C4530">Use 10–30g of cacao chips per serving, depending on how rich you</text>
<text x="17.00" y="58.09" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.78" fill="#5C4530">like your drink.</text>
<circle cx="14.40" cy="63.14" r="1.9" fill="#425A3A"/>
<text x="14.40" y="63.69" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="2.85" font-weight="700" fill="#fff">2</text>
<text x="17.00" y="64.24" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.78" fill="#5C4530">Add to 150–200ml of water or a nut milk such as almond or oat (for</text>
<text x="17.00" y="67.99" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.78" fill="#5C4530">better absorption of the minerals). Avoid boiling.</text>
<circle cx="14.40" cy="73.04" r="1.9" fill="#425A3A"/>
<text x="14.40" y="73.59" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="2.85" font-weight="700" fill="#fff">3</text>
<text x="17.00" y="74.14" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="3.35" font-weight="700" fill="#2C1B0E">WHISK</text>
<text x="17.00" y="78.31" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.78" fill="#5C4530">Stir or whisk until smooth and creamy.</text>
<circle cx="14.40" cy="83.36" r="1.9" fill="#425A3A"/>
<text x="14.40" y="83.91" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="2.85" font-weight="700" fill="#fff">4</text>
<text x="17.00" y="84.46" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="3.35" font-weight="700" fill="#2C1B0E">MAKE IT YOURS</text>
<text x="17.00" y="88.63" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.78" fill="#5C4530">Add cinnamon, vanilla, chilli, honey, maple syrup or your favourite</text>
<text x="17.00" y="92.39" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.78" fill="#5C4530">spices if desired.</text>
<circle cx="14.40" cy="97.44" r="1.9" fill="#425A3A"/>
<text x="14.40" y="97.99" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="2.85" font-weight="700" fill="#fff">5</text>
<text x="17.00" y="98.54" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="3.35" font-weight="700" fill="#2C1B0E">SET YOUR INTENTION</text>
<text x="17.00" y="102.71" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.78" fill="#5C4530">Take a few slow breaths. Hold your cup to your heart, set an</text>
<text x="17.00" y="106.46" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.78" fill="#5C4530">intention for your moment, and sip slowly.</text>
<line x1="12.8" y1="109.87" x2="147.20000000000002" y2="109.87" stroke="#4A2F18" stroke-width="0.2" opacity="0.4"/>
<text x="12.8" y="113.64" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="3.45" font-weight="700" letter-spacing="0.86" fill="#425A3A">NUTRITIONAL VALUES &#183; PER 100G</text>
<text x="12.8" y="120.79" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.87" fill="#2C1B0E">Energy</text>
<text x="147.20000000000002" y="120.79" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.87" fill="#5C4530">2,590 kJ / 620 kcal</text>
<line x1="12.8" y1="122.71" x2="147.20000000000002" y2="122.71" stroke="#4A2F18" stroke-width="0.12" opacity="0.25"/>
<text x="12.8" y="126.29" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.87" fill="#2C1B0E">Fat</text>
<text x="147.20000000000002" y="126.29" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.87" fill="#5C4530">53 g</text>
<line x1="12.8" y1="128.21" x2="147.20000000000002" y2="128.21" stroke="#4A2F18" stroke-width="0.12" opacity="0.25"/>
<text x="12.8" y="131.79" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.87" fill="#2C1B0E">of which saturates</text>
<text x="147.20000000000002" y="131.79" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.87" fill="#5C4530">32 g</text>
<line x1="12.8" y1="133.71" x2="147.20000000000002" y2="133.71" stroke="#4A2F18" stroke-width="0.12" opacity="0.25"/>
<text x="12.8" y="137.29" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.87" fill="#2C1B0E">Carbohydrate</text>
<text x="147.20000000000002" y="137.29" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.87" fill="#5C4530">22 g</text>
<line x1="12.8" y1="139.21" x2="147.20000000000002" y2="139.21" stroke="#4A2F18" stroke-width="0.12" opacity="0.25"/>
<text x="12.8" y="142.79" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.87" fill="#2C1B0E">of which sugars</text>
<text x="147.20000000000002" y="142.79" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.87" fill="#5C4530">1.5 g</text>
