<text x="12.8" y="148.29" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.87" fill="#2C1B0E">Fibre</text>
<text x="147.20000000000002" y="148.29" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.87" fill="#5C4530">14 g</text>
<line x1="12.8" y1="150.21" x2="147.20000000000002" y2="150.21" stroke="#4A2F18" stroke-width="0.12" opacity="0.25"/>
<text x="12.8" y="153.79" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.87" fill="#2C1B0E">Protein</text>
<text x="147.20000000000002" y="153.79" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.87" fill="#5C4530">13 g</text>
<line x1="12.8" y1="155.71" x2="147.20000000000002" y2="155.71" stroke="#4A2F18" stroke-width="0.12" opacity="0.25"/>
<text x="12.8" y="159.29" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.87" fill="#2C1B0E">Salt</text>
<text x="147.20000000000002" y="159.29" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.87" fill="#5C4530">0.03 g</text>
<line x1="12.8" y1="161.21" x2="147.20000000000002" y2="161.21" stroke="#4A2F18" stroke-width="0.12" opacity="0.25"/>
<text x="12.8" y="164.79" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.87" fill="#2C1B0E">Magnesium</text>
<text x="147.20000000000002" y="164.79" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.87" fill="#5C4530">499 mg</text>
<line x1="12.8" y1="166.71" x2="147.20000000000002" y2="166.71" stroke="#4A2F18" stroke-width="0.12" opacity="0.25"/>
<text x="12.8" y="170.29" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.87" fill="#2C1B0E">Iron</text>
<text x="147.20000000000002" y="170.29" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.87" fill="#5C4530">13.9 mg</text>
<line x1="12.8" y1="172.21" x2="147.20000000000002" y2="172.21" stroke="#4A2F18" stroke-width="0.12" opacity="0.25"/>
<text x="12.8" y="175.79" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.87" fill="#2C1B0E">Potassium</text>
<text x="147.20000000000002" y="175.79" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.87" fill="#5C4530">1,524 mg</text>
<line x1="12.8" y1="177.71" x2="147.20000000000002" y2="177.71" stroke="#4A2F18" stroke-width="0.12" opacity="0.25"/>
<text x="12.8" y="181.29" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.87" fill="#2C1B0E">Zinc</text>
