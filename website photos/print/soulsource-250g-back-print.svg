<svg xmlns="http://www.w3.org/2000/svg" width="120mm" height="170mm" viewBox="0 0 120 170" role="img" aria-label="Soulsource Ceremonial Cacao 250g — Back Label">
  <title>Soulsource Ceremonial Cacao 250g — Back Label</title>
  <rect width="120" height="170" fill="#D8CFBE"/>
  <rect x="5.10" y="5.10" width="109.80" height="159.80" fill="none" stroke="#4A2F18" stroke-width="0.35" opacity="0.6"/>
<g transform="translate(60.0,7.65)"><path d="M -1.3,-1.5 A 1.7,1.7 0 1 0 -1.3,1.5 A 2.0,2.0 0 1 1 -1.3,-1.5 Z" fill="#4A2F18"/></g>
<text x="60.0" y="15" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="6.8" font-weight="700" fill="#8A6A2F">soulsource</text>
<text x="60.0" y="19.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="2.3" font-weight="600" letter-spacing="0.69" fill="#2C1B0E">CEREMONIAL CACAO</text>
<line x1="9.6" y1="21.57" x2="110.4" y2="21.57" stroke="#4A2F18" stroke-width="0.2" opacity="0.4"/>
<text x="9.6" y="33.00" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.6" font-weight="700" letter-spacing="0.78" fill="#425A3A">YOUR CACAO RITUAL</text>
<circle cx="11.20" cy="36.27" r="1.9" fill="#425A3A"/>
<text x="11.20" y="36.82" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="2.04" font-weight="700" fill="#fff">1</text>
<text x="13.80" y="37.37" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.4" font-weight="700" fill="#2C1B0E">MEASURE</text>
<text x="13.80" y="40.34" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="1.98" fill="#5C4530">Use 10–30g of cacao chips per serving, depending on how</text>
<text x="13.80" y="43.01" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="1.98" fill="#5C4530">rich you like your drink.</text>
<circle cx="11.20" cy="46.28" r="1.9" fill="#425A3A"/>
<text x="11.20" y="46.83" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="2.04" font-weight="700" fill="#fff">2</text>
<text x="13.80" y="47.38" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="1.98" fill="#5C4530">Add to 150–200ml of water or a nut milk such as almond or</text>
<text x="13.80" y="50.05" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="1.98" fill="#5C4530">oat (for better absorption of the minerals). Avoid boiling.</text>
<circle cx="11.20" cy="53.32" r="1.9" fill="#425A3A"/>
<text x="11.20" y="53.87" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="2.04" font-weight="700" fill="#fff">3</text>
<text x="13.80" y="54.42" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.4" font-weight="700" fill="#2C1B0E">WHISK</text>
<text x="13.80" y="57.39" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="1.98" fill="#5C4530">Stir or whisk until smooth and creamy.</text>
<circle cx="11.20" cy="60.66" r="1.9" fill="#425A3A"/>
<text x="11.20" y="61.21" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="2.04" font-weight="700" fill="#fff">4</text>
<text x="13.80" y="61.76" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.4" font-weight="700" fill="#2C1B0E">MAKE IT YOURS</text>
<text x="13.80" y="64.73" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="1.98" fill="#5C4530">Add cinnamon, vanilla, chilli, honey, maple syrup or your</text>
<text x="13.80" y="67.41" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="1.98" fill="#5C4530">favourite spices if desired.</text>
<circle cx="11.20" cy="70.68" r="1.9" fill="#425A3A"/>
<text x="11.20" y="71.23" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="2.04" font-weight="700" fill="#fff">5</text>
<text x="13.80" y="71.78" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.4" font-weight="700" fill="#2C1B0E">SET YOUR INTENTION</text>
<text x="13.80" y="74.75" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="1.98" fill="#5C4530">Take a few slow breaths. Hold your cup to your heart, set</text>
<text x="13.80" y="77.42" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="1.98" fill="#5C4530">an intention for your moment, and sip slowly.</text>
<line x1="9.6" y1="79.85" x2="110.4" y2="79.85" stroke="#4A2F18" stroke-width="0.2" opacity="0.4"/>
<text x="9.6" y="82.52" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.48" font-weight="700" letter-spacing="0.62" fill="#425A3A">NUTRITIONAL VALUES &#183; PER 100G</text>
<text x="9.6" y="87.61" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#2C1B0E">Energy</text>
<text x="110.4" y="87.61" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#5C4530">2,590 kJ / 620 kcal</text>
<line x1="9.6" y1="88.99" x2="110.4" y2="88.99" stroke="#4A2F18" stroke-width="0.12" opacity="0.25"/>
<text x="9.6" y="91.53" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#2C1B0E">Fat</text>
<text x="110.4" y="91.53" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#5C4530">53 g</text>
<line x1="9.6" y1="92.91" x2="110.4" y2="92.91" stroke="#4A2F18" stroke-width="0.12" opacity="0.25"/>
<text x="9.6" y="95.45" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#2C1B0E">of which saturates</text>
<text x="110.4" y="95.45" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#5C4530">32 g</text>
<line x1="9.6" y1="96.83" x2="110.4" y2="96.83" stroke="#4A2F18" stroke-width="0.12" opacity="0.25"/>
<text x="9.6" y="99.37" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#2C1B0E">Carbohydrate</text>
<text x="110.4" y="99.37" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#5C4530">22 g</text>
<line x1="9.6" y1="100.75" x2="110.4" y2="100.75" stroke="#4A2F18" stroke-width="0.12" opacity="0.25"/>
<text x="9.6" y="103.29" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#2C1B0E">of which sugars</text>
<text x="110.4" y="103.29" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#5C4530">1.5 g</text>
<line x1="9.6" y1="104.67" x2="110.4" y2="104.67" stroke="#4A2F18" stroke-width="0.12" opacity="0.25"/>
<text x="9.6" y="107.21" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#2C1B0E">Fibre</text>
<text x="110.4" y="107.21" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#5C4530">14 g</text>
<line x1="9.6" y1="108.59" x2="110.4" y2="108.59" stroke="#4A2F18" stroke-width="0.12" opacity="0.25"/>
<text x="9.6" y="111.13" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#2C1B0E">Protein</text>
<text x="110.4" y="111.13" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#5C4530">13 g</text>
<line x1="9.6" y1="112.51" x2="110.4" y2="112.51" stroke="#4A2F18" stroke-width="0.12" opacity="0.25"/>
<text x="9.6" y="115.05" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#2C1B0E">Salt</text>
<text x="110.4" y="115.05" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#5C4530">0.03 g</text>
<line x1="9.6" y1="116.43" x2="110.4" y2="116.43" stroke="#4A2F18" stroke-width="0.12" opacity="0.25"/>
<text x="9.6" y="118.97" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#2C1B0E">Magnesium</text>
<text x="110.4" y="118.97" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#5C4530">499 mg</text>
<line x1="9.6" y1="120.35" x2="110.4" y2="120.35" stroke="#4A2F18" stroke-width="0.12" opacity="0.25"/>
<text x="9.6" y="122.89" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#2C1B0E">Iron</text>
<text x="110.4" y="122.89" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#5C4530">13.9 mg</text>
<line x1="9.6" y1="124.27" x2="110.4" y2="124.27" stroke="#4A2F18" stroke-width="0.12" opacity="0.25"/>
<text x="9.6" y="126.81" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#2C1B0E">Potassium</text>
<text x="110.4" y="126.81" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#5C4530">1,524 mg</text>
<line x1="9.6" y1="128.19" x2="110.4" y2="128.19" stroke="#4A2F18" stroke-width="0.12" opacity="0.25"/>
<text x="9.6" y="130.73" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#2C1B0E">Zinc</text>
<text x="110.4" y="130.73" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.03" fill="#5C4530">6.8 mg</text>
<line x1="9.6" y1="132.11" x2="110.4" y2="132.11" stroke="#4A2F18" stroke-width="0.12" opacity="0.25"/>
<line x1="9.6" y1="135.62" x2="110.4" y2="135.62" stroke="#4A2F18" stroke-width="0.2" opacity="0.4"/>
<text x="9.6" y="137.32" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.22" font-weight="700" fill="#2C1B0E">INGREDIENTS</text>
<text x="9.6" y="140.65" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.22" fill="#5C4530">100% Venezuelan cacao. No additives, just pure cacao in its most</text>
<text x="9.6" y="143.65" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.22" fill="#5C4530">potent form.</text>
<text x="9.6" y="147.75" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.22" font-weight="700" fill="#2C1B0E">STORAGE</text>
<text x="9.6" y="151.08" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.22" fill="#5C4530">Store in a cool, dark place and keep airtight after opening.</text>
<text x="9.6" y="154.08" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.22" fill="#5C4530">Suggested serving 10–30g.</text>
<line x1="9.6" y1="157.97" x2="110.4" y2="157.97" stroke="#4A2F18" stroke-width="0.2" opacity="0.4"/>
<text x="9.6" y="159.96" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="3.00" font-weight="700" fill="#2C1B0E">250g <tspan font-size="1.89" baseline-shift="0.89">e</tspan></text>
<text x="110.4" y="159.96" text-anchor="end" font-family="'Schibsted Grotesk', Helvetica, Arial, sans-serif" font-size="2.22" fill="#5C4530">@thehilltopsauna</text>
</svg>
